name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - run: cp public/CNAME dist/CNAME 2>/dev/null || true; touch dist/.nojekyll; cp dist/index.html dist/404.html; mkdir -p dist/ar dist/en dist/ar/fabrics dist/en/fabrics dist/ar/grades dist/ar/gallery dist/ar/api dist/ar/trade-desk dist/ar/bench dist/ar/match dist/ar/journal; for d in dist/ar dist/en dist/ar/fabrics dist/en/fabrics dist/ar/grades dist/ar/gallery dist/ar/api dist/ar/trade-desk dist/ar/bench dist/ar/match dist/ar/journal; do cp dist/index.html "$d/index.html"; done; echo '<urlset><url><loc>https://alazhartex.com/ar/</loc></url></urlset>' > dist/sitemap.xml
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
